<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Опросник для подруги ⚡</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Georgia', 'Times New Roman', serif; }

  body {
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh;
    background: radial-gradient(ellipse at 50% 0%, #1a1a3e 0%, #0d0d1f 55%, #05050f 100%);
    padding: 16px;
    position: relative;
    overflow-x: hidden;
  }

  /* Звёзды на фоне */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      radial-gradient(1.5px 1.5px at 12% 18%, #fff8e1 50%, transparent 50%),
      radial-gradient(1px 1px at 28% 42%, #ffe082 50%, transparent 50%),
      radial-gradient(1.8px 1.8px at 45% 12%, #ffffff 50%, transparent 50%),
      radial-gradient(1px 1px at 63% 35%, #fff8e1 50%, transparent 50%),
      radial-gradient(1.5px 1.5px at 78% 20%, #ffe082 50%, transparent 50%),
      radial-gradient(1px 1px at 88% 55%, #ffffff 50%, transparent 50%),
      radial-gradient(1.2px 1.2px at 8% 70%, #fff8e1 50%, transparent 50%),
      radial-gradient(1px 1px at 35% 85%, #ffe082 50%, transparent 50%),
      radial-gradient(1.6px 1.6px at 55% 72%, #ffffff 50%, transparent 50%),
      radial-gradient(1px 1px at 72% 88%, #fff8e1 50%, transparent 50%),
      radial-gradient(1.2px 1.2px at 92% 78%, #ffe082 50%, transparent 50%),
      radial-gradient(1px 1px at 20% 50%, #ffffff 50%, transparent 50%);
    opacity: 0.7;
    pointer-events: none;
    z-index: 0;
    animation: twinkle 6s ease-in-out infinite alternate;
  }
  @keyframes twinkle { 0% { opacity: 0.45; } 100% { opacity: 0.85; } }

  .container {
    max-width: 480px; width: 100%;
    background: linear-gradient(160deg, rgba(30, 27, 58, 0.92) 0%, rgba(16, 14, 34, 0.95) 100%);
    border-radius: 16px;
    box-shadow:
      0 0 0 2px #b8860b,
      0 0 0 5px #1a1a3e,
      0 0 0 6px #8b6914,
      0 25px 60px -12px rgba(0, 0, 0, 0.85),
      0 0 80px rgba(184, 134, 11, 0.12);
    padding: 30px 22px 36px;
    position: relative;
    z-index: 2;
    border: 1px solid rgba(255, 215, 0, 0.15);
  }

  /* Уголки-рамки как у старинных книг */
  .container::before, .container::after {
    content: '✦';
    position: absolute;
    color: #d4af37;
    font-size: 18px;
    opacity: 0.55;
  }
  .container::before { top: 10px; left: 14px; }
  .container::after { bottom: 10px; right: 14px; }

  .screen {
    display: none; flex-direction: column; align-items: center; text-align: center;
    position: relative; z-index: 2; animation: fadeSlide 0.5s ease;
  }
  .screen.active { display: flex; }
  @keyframes fadeSlide { 0% { opacity: 0; transform: translateY(24px); } 100% { opacity: 1; transform: translateY(0); } }

  h1 {
    font-size: 27px; font-weight: 700; color: #f0d060;
    margin-bottom: 8px; letter-spacing: 0.5px;
    text-shadow: 0 0 18px rgba(240, 208, 96, 0.45);
  }
  h2 {
    font-size: 21px; font-weight: 600; color: #e8c547;
    margin-bottom: 10px; letter-spacing: 0.4px;
    text-shadow: 0 0 14px rgba(232, 197, 71, 0.35);
  }
  p { font-size: 15px; color: #d8d4e8; line-height: 1.6; margin-bottom: 16px; }
  .sub { font-size: 13px; color: #a9a3c4; opacity: 0.9; font-style: italic; }

  .emblem { font-size: 58px; margin-bottom: 6px; filter: drop-shadow(0 0 16px rgba(240, 208, 96, 0.5)); }

  .btn {
    background: linear-gradient(180deg, #d4af37 0%, #a8821a 100%);
    border: 1px solid #f0d060;
    color: #1a1a2e;
    font-family: 'Georgia', serif;
    font-size: 17px; font-weight: 700;
    padding: 14px 30px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.4);
    width: 100%; max-width: 300px; margin: 8px 0;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .btn:hover {
    transform: translateY(-2px);
    background: linear-gradient(180deg, #f0d060 0%, #c49a24 100%);
    box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.5);
  }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }

  .btn-outline {
    background: transparent; border: 1px solid #d4af37; color: #e8c547;
    box-shadow: none;
  }
  .btn-outline:hover { background: rgba(212, 175, 55, 0.12); color: #f0d060; }

  .btn-success {
    background: linear-gradient(180deg, #4a8c5a 0%, #2d5a38 100%);
    border: 1px solid #7fc28f;
    color: #eaffea;
  }
  .btn-success:hover {
    background: linear-gradient(180deg, #5ca86c 0%, #3a7048 100%);
    box-shadow: 0 6px 20px rgba(74, 140, 90, 0.4);
  }

  .progress-wrap { width: 100%; margin-bottom: 18px; }
  .progress-bar-bg { height: 7px; background: #1a1a3e; border-radius: 10px; overflow: hidden; border: 1px solid rgba(212, 175, 55, 0.25); }
  .progress-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #8b6914, #d4af37, #f0d060); border-radius: 10px; transition: width 0.35s ease; box-shadow: 0 0 10px rgba(240, 208, 96, 0.5); }
  .progress-text { font-size: 11px; color: #c9b26a; margin-top: 6px; text-align: right; letter-spacing: 0.5px; }

  .question-block { width: 100%; text-align: left; margin-bottom: 14px; }
  .question-block label { display: block; font-size: 13.5px; font-weight: 600; color: #e8c547; margin-bottom: 6px; line-height: 1.4; letter-spacing: 0.2px; }
  .question-block textarea {
    width: 100%; box-sizing: border-box;
    border: 1px solid #3a3558;
    border-radius: 6px;
    padding: 10px 14px;
    font-family: 'Georgia', serif;
    font-size: 14px;
    background: rgba(10, 9, 22, 0.85);
    color: #e8e4f5;
    resize: vertical; min-height: 44px;
    outline: none; transition: all 0.2s;
  }
  .question-block textarea::placeholder { color: #5a5478; font-style: italic; }
  .question-block textarea:focus {
    border-color: #d4af37;
    box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15), inset 0 0 8px rgba(212, 175, 55, 0.06);
    background: rgba(14, 12, 28, 0.95);
  }

  .block-title { font-size: 17px; font-weight: 700; color: #f0d060; margin: 4px 0 12px; text-align: center; width: 100%; letter-spacing: 0.5px; }

  .final-card {
    background: rgba(10, 9, 22, 0.8);
    border: 1px solid rgba(212, 175, 55, 0.3);
    border-radius: 10px;
    padding: 16px 18px; width: 100%;
    margin: 10px 0;
    box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.4);
    text-align: left;
    max-height: 260px; overflow-y: auto;
  }
  .final-card::-webkit-scrollbar { width: 6px; }
  .final-card::-webkit-scrollbar-track { background: #1a1a3e; border-radius: 3px; }
  .final-card::-webkit-scrollbar-thumb { background: #b8860b; border-radius: 3px; }
  .final-card .block-name { font-size: 12px; font-weight: 700; color: #d4af37; margin: 10px 0 6px; text-transform: uppercase; letter-spacing: 0.8px; }
  .final-card .block-name:first-child { margin-top: 0; }
  .final-card .qa { font-size: 13px; color: #d8d4e8; line-height: 1.45; margin-bottom: 8px; }
  .final-card .qa .q { color: #a9a3c4; font-weight: 600; }
  .final-card .qa .a { color: #f0d060; }

  .confetti { font-size: 44px; margin: 4px 0; filter: drop-shadow(0 0 16px rgba(240, 208, 96, 0.6)); }
  .status-ok { color: #7fc28f; font-size: 13px; margin-top: 6px; }
  .status-error { color: #e57373; font-size: 13px; margin-top: 6px; }

  @media (max-width: 480px) {
    .container { padding: 24px 14px 30px; }
    h1 { font-size: 23px; }
    .btn { font-size: 15px; padding: 13px 20px; }
    .emblem { font-size: 50px; }
  }
</style>
</head>
<body>

<div class="container" id="app">

  <!-- ЭКРАН 1: ПРИВЕТСТВИЕ -->
  <div class="screen active" id="screen0">
    <!-- Заменили палочку на безопасную звездочку -->
    <div class="emblem">⚡✨</div>
    <h1>Привет, подруга!</h1>
    <p>Хочу закрепить знания о тебе.</p>
    <p class="sub">Ответь на несколько вопросов — это займёт пару минут. Твои ответы придут мне.</p>
    <button class="btn" onclick="startSurvey()">Начать опрос</button>
  </div>

  <!-- ЭКРАНЫ ВОПРОСОВ генерируются скриптом -->
  <div id="questionScreens"></div>

  <!-- ФИНАЛЬНЫЙ ЭКРАН -->
  <div class="screen" id="screenFinal">
    <div class="confetti">📜✨</div>
    <h2>Свиток готов!</h2>
    <p class="sub">Проверь ответы и отправь мне.</p>
    <div class="final-card" id="finalSummary"></div>
    <button class="btn btn-success" onclick="sendNotification()" id="sendBtn">📨 Отправить организатору</button>
    <p id="sendStatus"></p>
    <button class="btn btn-outline" onclick="resetAll()" style="margin-top:4px;">Начать заново</button>
  </div>

</div>

<script>
  // ============================================================
  // 🔧 НАСТРОЙКИ
  // ============================================================
  const CONFIG = {
    BOT_TOKEN: "8813795823:AAG6oh1nW8wrOUEYe4VvO9hJD_IZUsSBsTI",
    CHAT_ID: "943862860",
  };
  // ============================================================

  // Блоки вопросов — можно менять/добавлять
  const BLOCKS = [
    {
      name: "🎨 Вкусы и предпочтения",
      questions: [
        "Любимый цвет и почему именно он?",
        "Любимый фильм или сериал, который можешь пересматривать бесконечно?",
        "Книга, которая тебя больше всего впечатлила?",
        "Любимая музыка/исполнитель под настроение?",
        "Есть блюдо, которое ты готова есть всегда?"
      ]
    },
    {
      name: "💭 Ценности и характер",
      questions: [
        "Что для тебя важнее: сделать идеально или сделать вовремя?",
        "За что тебе было бы стыдно перед самой собой?",
        "Какое качество в людях ты ценишь больше всего?",
        "Что мгновенно выводит тебя из себя в общении?",
        "Ты скорее человек привычки или любишь перемены?"
      ]
    },
    {
      name: "⚡ Энергия и отдых",
      questions: [
        "Ты заряжаешься в компании людей или наедине с собой?",
        "Как выглядит твой идеальный выходной, если ты предоставлена сама себе?",
        "Как ты восстанавливаешься после тяжёлой недели?",
        "Ты «жаворонок» или «сова»?",
        "Обсуждаешь проблему сразу или сначала «переспишь» с ней?"
      ]
    },
    {
      name: "🚀 Мечты, прошлое и будущее",
      questions: [
        "Какой совет ты бы дала себе 5 лет назад?",
        "Если бы деньги не имели значения, чем бы ты занималась прямо сейчас?",
        "О чём ты мечтаешь, но пока не решаешься?",
        "Какое путешествие запомнилось тебе больше всего?",
        "Чему ты хочешь научиться в ближайший год?"
      ]
    },
    {
      name: "😄 Лёгкое и неожиданное",
      questions: [
        "Какой самый странный или бесполезный талант у тебя есть?",
        "За что ты последний раз искренне благодарила кого-то (или жизнь в целом)?",
        "Какой вопрос ты бы хотела задать мне в ответ, чтобы он остался между нами?",
        "Любимое место, где тебе по-настоящему хорошо?",
        "Вещь, без которой не выходишь из дома?"
      ]
    }
  ];

  let currentBlock = 0;
  let answers = [];
  let notificationSent = false;

  function initAnswers() {
    answers = BLOCKS.map(b => b.questions.map(() => ""));
  }
  initAnswers();

  function buildQuestionScreens() {
    const wrap = document.getElementById('questionScreens');
    wrap.innerHTML = '';
    BLOCKS.forEach((block, bi) => {
      const screen = document.createElement('div');
      screen.className = 'screen';
      screen.id = 'screenQ' + bi;
      screen.innerHTML = `
        <div class="progress-wrap">
          <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill${bi}"></div></div>
          <div class="progress-text">Блок ${bi + 1} из ${BLOCKS.length}</div>
        </div>
        <div class="block-title">${block.name}</div>
        <div id="questionsWrap${bi}" style="width:100%;"></div>
        <button class="btn" id="nextBtn${bi}" onclick="nextBlock(${bi})" disabled>Далее →</button>
      `;
      wrap.appendChild(screen);

      const qWrap = screen.querySelector('#questionsWrap' + bi);
      block.questions.forEach((q, qi) => {
        const div = document.createElement('div');
        div.className = 'question-block';
        div.innerHTML = `
          <label>${bi * 5 + qi + 1}. ${q}</label>
          <textarea id="ans-${bi}-${qi}" placeholder="Твой ответ..." oninput="onAnswerInput(${bi}, ${qi})"></textarea>
        `;
        qWrap.appendChild(div);
      });
    });
  }
  buildQuestionScreens();

  function onAnswerInput(bi, qi) {
    const ta = document.getElementById(`ans-${bi}-${qi}`);
    answers[bi][qi] = ta.value.trim();
    updateNextButton(bi);
    updateProgress(bi);
  }

  function updateNextButton(bi) {
    const btn = document.getElementById('nextBtn' + bi);
    const filled = answers[bi].every(a => a.length > 0);
    btn.disabled = !filled;
    btn.textContent = filled ? 'Далее →' : 'Заполни все поля...';
  }

  function updateProgress(bi) {
    const fill = document.getElementById('progressFill' + bi);
    if (!fill) return;
    const filled = answers[bi].filter(a => a.length > 0).length;
    const total = answers[bi].length;
    fill.style.width = (filled / total * 100) + '%';
  }

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
    const target = document.getElementById(id);
    if (target) target.classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function startSurvey() {
    currentBlock = 0;
    showScreen('screenQ0');
    updateNextButton(0);
    updateProgress(0);
  }

  function nextBlock(bi) {
    if (bi < BLOCKS.length - 1) {
      currentBlock = bi + 1;
      showScreen('screenQ' + currentBlock);
      updateNextButton(currentBlock);
      updateProgress(currentBlock);
    } else {
      showFinal();
    }
  }

  function showFinal() {
    const summary = document.getElementById('finalSummary');
    summary.innerHTML = '';
    BLOCKS.forEach((block, bi) => {
      const bn = document.createElement('div');
      bn.className = 'block-name';
      bn.textContent = block.name;
      summary.appendChild(bn);
      block.questions.forEach((q, qi) => {
        const qa = document.createElement('div');
        qa.className = 'qa';
        qa.innerHTML = `<span class="q">${q}</span><br><span class="a">${answers[bi][qi] || '—'}</span>`;
        summary.appendChild(qa);
      });
    });

    notificationSent = false;
    const status = document.getElementById('sendStatus');
    status.textContent = '';
    status.className = '';
    const btn = document.getElementById('sendBtn');
    btn.style.display = 'block';
    btn.disabled = false;
    btn.textContent = '📨 Отправить организатору';

    showScreen('screenFinal');
  }

  async function sendNotification() {
    const btn = document.getElementById('sendBtn');
    const status = document.getElementById('sendStatus');

    if (notificationSent) {
      status.textContent = '✅ Уже отправлено!';
      status.className = 'status-ok';
      return;
    }

    btn.disabled = true;
    btn.textContent = '⏳ Отправляю...';
    status.textContent = '⏳ Отправка...';
    status.className = '';

    let message = '⚡ ОТВЕТЫ НА ОПРОСНИК ⚡\n\n';
    BLOCKS.forEach((block, bi) => {
      message += block.name + '\n';
      block.questions.forEach((q, qi) => {
        message += `${bi * 5 + qi + 1}. ${q}\n   ${answers[bi][qi] || '—'}\n`;
      });
      message += '\n';
    });

    try {
      const url = `https://api.telegram.org/bot${CONFIG.BOT_TOKEN}/sendMessage`;
      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          chat_id: CONFIG.CHAT_ID,
          text: message,
        })
      });
      const data = await response.json();
      if (data.ok) {
        status.textContent = '✅ Ответы отправлены!';
        status.className = 'status-ok';
        notificationSent = true;
        btn.style.display = 'none';
      } else {
        throw new Error(data.description || 'Неизвестная ошибка');
      }
    } catch (error) {
      console.error('❌ Ошибка:', error);
      status.textContent = '❌ ' + error.message;
      status.className = 'status-error';
      btn.disabled = false;
      btn.textContent = '📨 Попробовать снова';
    }
  }

  function resetAll() {
    initAnswers();
    currentBlock = 0;
    notificationSent = false;

    document.querySelectorAll('.question-block textarea').forEach(ta => ta.value = '');
    document.querySelectorAll('.progress-bar-fill').forEach(f => f.style.width = '0%');
    BLOCKS.forEach((_, bi) => updateNextButton(bi));

    const status = document.getElementById('sendStatus');
    status.textContent = '';
    status.className = '';
    const btn = document.getElementById('sendBtn');
    btn.style.display = 'block';
    btn.disabled = false;
    btn.textContent = '📨 Отправить организатору';

    showScreen('screen0');
  }

  console.log('⚡ Опросник загружен!');
</script>
</body>
</html>
