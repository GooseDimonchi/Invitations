<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Распределяющая Шляпа 🎩</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Georgia', 'Times New Roman', serif; }

  body {
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh;
    background: #0a0a14;
    background-image: 
      radial-gradient(circle at 50% 10%, rgba(40, 30, 60, 0.8) 0%, transparent 60%),
      radial-gradient(circle at 80% 90%, rgba(20, 40, 20, 0.4) 0%, transparent 40%),
      linear-gradient(180deg, #050508 0%, #12101a 100%);
    padding: 16px;
    position: relative;
    overflow-x: hidden;
  }

  /* Звёзды */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: 
      radial-gradient(1.5px 1.5px at 10% 20%, #fff8e1 50%, transparent 50%),
      radial-gradient(1px 1px at 30% 60%, #ffe082 50%, transparent 50%),
      radial-gradient(1.8px 1.8px at 50% 15%, #ffffff 50%, transparent 50%),
      radial-gradient(1px 1px at 70% 80%, #fff8e1 50%, transparent 50%),
      radial-gradient(1.2px 1.2px at 90% 40%, #ffffff 50%, transparent 50%);
    opacity: 0.5;
    pointer-events: none;
    z-index: 0;
    animation: twinkle 7s infinite alternate;
  }
  @keyframes twinkle { 0% { opacity: 0.3; } 100% { opacity: 0.7; } }

  .container {
    max-width: 540px; width: 100%;
    background: linear-gradient(160deg, #f4e8c1 0%, #e8d5a3 100%);
    border-radius: 4px;
    box-shadow: 
      0 0 0 2px #8b6914,
      0 0 0 6px #3e2a10,
      0 0 0 8px #8b6914,
      0 25px 60px -12px rgba(0, 0, 0, 0.9),
      inset 0 0 50px rgba(139, 105, 20, 0.15);
    padding: 32px 24px 38px;
    position: relative;
    z-index: 2;
    color: #2a1a0a;
  }

  .screen {
    display: none; flex-direction: column; align-items: center; text-align: center;
    position: relative; z-index: 3; animation: reveal 0.6s ease;
  }
  .screen.active { display: flex; }
  
  @keyframes reveal { 
    0% { opacity: 0; transform: scale(0.98); } 
    100% { opacity: 1; transform: scale(1); } 
  }

  h1 {
    font-size: 26px; font-weight: 700; color: #4a2e0a;
    margin-bottom: 8px; letter-spacing: 0.5px;
    text-shadow: 1px 1px 0 rgba(255,255,255,0.4);
  }
  h2 {
    font-size: 20px; font-weight: 700; color: #5c3a0a;
    margin-bottom: 10px; letter-spacing: 0.5px;
    border-bottom: 1px solid #b8860b;
    padding-bottom: 8px;
    width: 100%;
  }
  p { font-size: 15px; color: #3a2510; line-height: 1.6; margin-bottom: 16px; }
  .sub { font-size: 13px; color: #6b4a1a; opacity: 0.9; font-style: italic; }

  .emblem { font-size: 54px; margin-bottom: 8px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }

  .btn {
    background: linear-gradient(180deg, #d4af37 0%, #a8821a 100%);
    border: 1px solid #8b6914;
    color: #1a1205;
    font-family: 'Georgia', serif;
    font-size: 15px; font-weight: 700;
    padding: 14px 24px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
    width: 100%; max-width: 340px; margin: 8px 0;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .btn:hover {
    background: linear-gradient(180deg, #f0d060 0%, #c49a24 100%);
    box-shadow: 0 6px 15px rgba(0, 0, 0, 0.5);
  }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; filter: grayscale(100%); }

  .btn-danger {
    background: linear-gradient(180deg, #8b0000 0%, #4a0000 100%);
    border: 1px solid #3a0000;
    color: #ffd0d0;
  }
  .btn-danger:hover {
    background: linear-gradient(180deg, #b22222 0%, #6a0000 100%);
    color: #ffffff;
  }

  .progress-wrap { width: 100%; margin-bottom: 20px; }
  .progress-bar-bg { height: 6px; background: #c4b48a; border: 1px solid #8b6914; border-radius: 3px; overflow: hidden; }
  .progress-bar-fill { height: 100%; width: 0%; background: #8b0000; transition: width 0.35s ease; }
  .progress-text { font-size: 11px; color: #6b4a1a; margin-top: 6px; text-align: right; letter-spacing: 1px; font-weight: bold; }

  .question-block { width: 100%; text-align: left; margin-bottom: 16px; }
  .question-block label { display: block; font-size: 14px; font-weight: 700; color: #4a2e0a; margin-bottom: 6px; line-height: 1.45; }
  .question-block textarea {
    width: 100%; box-sizing: border-box;
    border: 1px solid #b8860b;
    border-radius: 2px;
    padding: 10px 12px;
    font-family: 'Georgia', serif;
    font-size: 14px;
    background: rgba(255, 255, 255, 0.6);
    color: #2a1a0a;
    resize: vertical; min-height: 44px;
    outline: none; transition: all 0.2s;
  }
  .question-block textarea::placeholder { color: #8b6914; font-style: italic; }
  .question-block textarea:focus {
    border-color: #8b0000;
    box-shadow: 0 0 8px rgba(139, 0, 0, 0.2);
    background: #fffdf5;
  }

  .block-title { font-size: 16px; font-weight: 700; color: #8b0000; margin: 4px 0 14px; text-align: center; width: 100%; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px dashed #b8860b; padding-bottom: 6px; }

  /* Экран статистики */
  .stat-card {
    background: rgba(255, 255, 255, 0.4);
    border: 2px solid #8b6914;
    border-radius: 4px;
    padding: 20px;
    width: 100%;
    margin: 15px 0;
    text-align: center;
    box-shadow: inset 0 0 15px rgba(139, 105, 20, 0.1);
  }
  .stat-title { font-size: 14px; color: #6b4a1a; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; font-weight: bold; }
  .stat-percent { font-size: 36px; font-weight: bold; color: #8b0000; text-shadow: 1px 1px 0 rgba(255,255,255,0.5); margin-bottom: 10px; transition: color 0.5s; }
  .stat-verdict { font-size: 22px; color: #4a2e0a; font-weight: bold; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; }
  .stat-desc { font-size: 14px; color: #3a2510; line-height: 1.6; text-align: left; font-style: italic; }

  .status-ok { color: #2e7d32; font-size: 14px; margin-top: 10px; font-weight: bold; }
  .status-error { color: #c62828; font-size: 14px; margin-top: 10px; font-weight: bold; }

  @media (max-width: 480px) {
    .container { padding: 24px 14px 30px; }
    h1 { font-size: 22px; }
    .btn { font-size: 13px; padding: 12px 16px; }
    .stat-percent { font-size: 32px; }
  }
</style>
</head>
<body>

<div class="container" id="app">

  <!-- ЭКРАН 1: ПРИВЕТСТВИЕ -->
  <div class="screen active" id="screen0">
    <div class="emblem">🎩</div>
    <h1>Распределяющая Шляпа</h1>
    <p>Привет, подруга. Надень меня на голову, и я расскажу, где твоё место.</p>
    <p class="sub">20 вопросов о твоих ценностях, характере и желаниях. Твои ответы придут мне, а в конце я определю твой факультет.</p>
    <button class="btn" onclick="startSurvey()">Надеть шляпу</button>
  </div>

  <!-- ЭКРАНЫ ВОПРОСОВ -->
  <div id="questionScreens"></div>

  <!-- ФИНАЛЬНЫЙ ЭКРАН -->
  <div class="screen" id="screenFinal">
    <div class="emblem" style="font-size: 44px;">🏰</div>
    <h2>Шляпа всё решила!</h2>
    
    <div class="stat-card">
      <div class="stat-title">Твой факультет</div>
      <div class="stat-percent" id="survivalPercent">--</div>
      <div class="stat-verdict" id="survivalVerdict">Вычисляется...</div>
      <div class="stat-desc" id="survivalDesc">Ожидание данных...</div>
    </div>

    <button class="btn btn-danger" onclick="sendNotification()" id="sendBtn">📨 Отправить сове</button>
    <p id="sendStatus"></p>
    
    <button class="btn" onclick="resetAll()" style="margin-top:8px;">Пройти заново</button>
  </div>

</div>

<script>
  // ============================================================
  // 🔧 НАСТРОЙКИ
  // ============================================================
  const CONFIG = {
    BOT_TOKEN: "8813795823:AAG6oh1nW8wrOUEYe4VvO9hJD_IZUsSBsTI",
    CHAT_ID: "943862860",
  };
  // ============================================================

  // Блоки вопросов (20 вопросов, по 5 в каждом)
  const BLOCKS = [
    {
      name: "🦁 Ценности",
      questions: [
        "Что для тебя важнее всего в жизни?",
        "Если бы тебе предложили выбрать суперсилу, что бы это было?",
        "Как ты относишься к риску?",
        "Что ты чувствуешь, когда кто-то нуждается в твоей помощи?",
        "Твой главный страх?"
      ]
    },
    {
      name: "🐍 Амбиции",
      questions: [
        "Как ты обычно добиваешься своего?",
        "Что для тебя успех?",
        "Как ты относишься к правилам?",
        "Если бы у тебя была возможность стать лидером, ты бы согласилась?",
        "Твой девиз по жизни?"
      ]
    },
    {
      name: "🦅 Интеллект",
      questions: [
        "Как ты обычно решаешь сложные задачи?",
        "Что для тебя важнее: правда или комфорт?",
        "Любишь ли ты учиться?",
        "Какая книга или фильм изменили твой взгляд на мир?",
        "Как ты относишься к неопределённости?"
      ]
    },
    {
      name: "🦡 Верность",
      questions: [
        "Что для тебя значит дружба?",
        "Готов ли ты поступиться своими интересами ради близких?",
        "Как ты относишься к предательству?",
        "Что бы ты сделал, если бы твой друг оказался неправ?",
        "Твоё самое тёплое воспоминание?"
      ]
    }
  ];

  let currentBlock = 0;
  let answers = [];
  let notificationSent = false;
  let houseResult = "";

  function initAnswers() {
    answers = BLOCKS.map(b => b.questions.map(() => ""));
  }
  initAnswers();

  function buildQuestionScreens() {
    const wrap = document.getElementById('questionScreens');
    wrap.innerHTML = '';
    BLOCKS.forEach((block, bi) => {
      const screen = document.createElement('div');
      screen.className = 'screen';
      screen.id = 'screenQ' + bi;
      screen.innerHTML = `
        <div class="progress-wrap">
          <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill${bi}"></div></div>
          <div class="progress-text">Раздел ${bi + 1} из ${BLOCKS.length}</div>
        </div>
        <div class="block-title">${block.name}</div>
        <div id="questionsWrap${bi}" style="width:100%;"></div>
        <button class="btn" id="nextBtn${bi}" onclick="nextBlock(${bi})" disabled>Далее →</button>
      `;
      wrap.appendChild(screen);

      const qWrap = screen.querySelector('#questionsWrap' + bi);
      block.questions.forEach((q, qi) => {
        const div = document.createElement('div');
        div.className = 'question-block';
        div.innerHTML = `
          <label>${bi * 5 + qi + 1}. ${q}</label>
          <textarea id="ans-${bi}-${qi}" placeholder="Твой ответ..." oninput="onAnswerInput(${bi}, ${qi})"></textarea>
        `;
        qWrap.appendChild(div);
      });
    });
  }
  buildQuestionScreens();

  function onAnswerInput(bi, qi) {
    const ta = document.getElementById(`ans-${bi}-${qi}`);
    answers[bi][qi] = ta.value.trim();
    updateNextButton(bi);
    updateProgress(bi);
  }

  function updateNextButton(bi) {
    const btn = document.getElementById('nextBtn' + bi);
    const filled = answers[bi].every(a => a.length > 0);
    btn.disabled = !filled;
    btn.textContent = filled ? 'Далее →' : 'Заполни все поля...';
  }

  function updateProgress(bi) {
    const fill = document.getElementById('progressFill' + bi);
    if (!fill) return;
    const filled = answers[bi].filter(a => a.length > 0).length;
    const total = answers[bi].length;
    fill.style.width = (filled / total * 100) + '%';
  }

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
    const target = document.getElementById(id);
    if (target) target.classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function startSurvey() {
    currentBlock = 0;
    showScreen('screenQ0');
    updateNextButton(0);
    updateProgress(0);
  }

  function nextBlock(bi) {
    if (bi < BLOCKS.length - 1) {
      currentBlock = bi + 1;
      showScreen('screenQ' + currentBlock);
      updateNextButton(currentBlock);
      updateProgress(currentBlock);
    } else {
      calculateHouse();
      showFinal();
    }
  }

  // Логика определения факультета
  function calculateHouse() {
    let gryffindor = 0;
    let slytherin = 0;
    let ravenclaw = 0;
    let hufflepuff = 0;

    // Ключевые слова для каждого факультета
    const keywords = {
      gryffindor: ["смелость", "храбрость", "риск", "защита", "помощь", "друг", "честь", "битва", "сила", "отвага", "бесстрашие", "спасти"],
      slytherin: ["амбиции", "успех", "лидер", "власть", "цель", "ум", "хитрость", "победа", "деньги", "карьера", "правила", "обойти"],
      ravenclaw: ["знания", "ум", "логика", "анализ", "учеба", "правда", "книга", "интеллект", "мудрость", "разум", "наука", "исследование"],
      hufflepuff: ["верность", "дружба", "доброта", "терпение", "труд", "честность", "забота", "семья", "уют", "поддержка", "равенство", "мир"]
    };

    answers.forEach(blockAnswers => {
      blockAnswers.forEach(ans => {
        const lowerAns = ans.toLowerCase();
        
        if (keywords.gryffindor.some(kw => lowerAns.includes(kw))) gryffindor += 2;
        if (keywords.slytherin.some(kw => lowerAns.includes(kw))) slytherin += 2;
        if (keywords.ravenclaw.some(kw => lowerAns.includes(kw))) ravenclaw += 2;
        if (keywords.hufflepuff.some(kw => lowerAns.includes(kw))) hufflepuff += 2;

        if (ans.length > 15) {
            gryffindor += 1;
            slytherin += 1;
            ravenclaw += 1;
            hufflepuff += 1;
        }
      });
    });

    // Добавляем немного случайности, чтобы не было ничьи
    gryffindor += Math.floor(Math.random() * 3);
    slytherin += Math.floor(Math.random() * 3);
    ravenclaw += Math.floor(Math.random() * 3);
    hufflepuff += Math.floor(Math.random() * 3);

    const houses = [
      { name: "ГРИФФИНДОР", score: gryffindor, color: "#ae0001", desc: "Ты — истинный гриффиндорец! Смелость, отвага и готовность прийти на помощь — это твои главные качества. Ты не боишься рисковать и всегда защищаешь слабых. В твоей груди бьётся сердце льва." },
      { name: "СЛИЗЕРИН", score: slytherin, color: "#2a623d", desc: "Ты — слизеринец! Амбиции, хитрость и целеустремлённость помогают тебе добиваться своего. Ты знаешь, чего хочешь, и не боишься идти к цели. Ты умён, находчив и всегда на шаг впереди." },
      { name: "КОГТЕВРАН", score: ravenclaw, color: "#0e1a40", desc: "Ты — когтевранец! Ум, логика и жажда знаний — твои главные союзники. Ты любишь учиться, анализировать и искать истину. Твой острый ум и любознательность — твоё главное оружие." },
      { name: "ПУФФЕНДУЙ", score: hufflepuff, color: "#ecb939", desc: "Ты — пуффендуец! Верность, доброта и честность — твои главные черты. Ты всегда готов прийти на помощь, ценишь дружбу и умеешь создавать уют. Ты — душа компании и надёжный друг." }
    ];

    houses.sort((a, b) => b.score - a.score);
    const winner = houses[0];

    const percentEl = document.getElementById('survivalPercent');
    const verdictEl = document.getElementById('survivalVerdict');
    const descEl = document.getElementById('survivalDesc');

    percentEl.textContent = winner.name;
    percentEl.style.color = winner.color;
    verdictEl.textContent = "Добро пожаловать!";
    descEl.textContent = winner.desc;
  }

  function showFinal() {
    notificationSent = false;
    const status = document.getElementById('sendStatus');
    status.textContent = '';
    status.className = '';
    const btn = document.getElementById('sendBtn');
    btn.style.display = 'block';
    btn.disabled = false;
    btn.textContent = '📨 Отправить сове';
    showScreen('screenFinal');
  }

  async function sendNotification() {
    const btn = document.getElementById('sendBtn');
    const status = document.getElementById('sendStatus');

    if (notificationSent) {
      status.textContent = '✅ Письмо уже отправлено!';
      status.className = 'status-ok';
      return;
    }

    btn.disabled = true;
    btn.textContent = '⏳ Отправка...';
    status.textContent = '⏳ Отправка...';
    status.className = '';

    let message = '🎩 РАСПРЕДЕЛЕНИЕ В ХОГВАРТСЕ 🎩\n';
    message += `Факультет: ${document.getElementById('survivalPercent').textContent}\n`;
    message += `----------------------------\n\n`;

    BLOCKS.forEach((block, bi) => {
      message += block.name + '\n';
      block.questions.forEach((q, qi) => {
        message += `${bi * 5 + qi + 1}. ${q}\n   ${answers[bi][qi] || '—'}\n`;
      });
      message += '\n';
    });

    try {
      const url = `https://api.telegram.org/bot${CONFIG.BOT_TOKEN}/sendMessage`;
      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          chat_id: CONFIG.CHAT_ID,
          text: message,
        })
      });
      const data = await response.json();
      if (data.ok) {
        status.textContent = '✅ Письмо доставлено!';
        status.className = 'status-ok';
        notificationSent = true;
        btn.style.display = 'none';
      } else {
        throw new Error(data.description || 'Неизвестная ошибка');
      }
    } catch (error) {
      console.error('❌ Ошибка:', error);
      status.textContent = '❌ ' + error.message;
      status.className = 'status-error';
      btn.disabled = false;
      btn.textContent = '📨 Попробовать снова';
    }
  }

  function resetAll() {
    initAnswers();
    currentBlock = 0;
    notificationSent = false;

    document.querySelectorAll('.question-block textarea').forEach(ta => ta.value = '');
    document.querySelectorAll('.progress-bar-fill').forEach(f => f.style.width = '0%');
    BLOCKS.forEach((_, bi) => updateNextButton(bi));

    const status = document.getElementById('sendStatus');
    status.textContent = '';
    status.className = '';
    const btn = document.getElementById('sendBtn');
    btn.style.display = 'block';
    btn.disabled = false;
    btn.textContent = '📨 Отправить сове';

    showScreen('screen0');
  }

</script>
</body>
</html>
