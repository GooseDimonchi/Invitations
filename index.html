<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Хроники Десятого Доктора ⚡</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; }

  body {
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh;
    background: #0a1128;
    background-image: 
      radial-gradient(circle at 20% 30%, rgba(0, 180, 216, 0.15) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(0, 119, 182, 0.15) 0%, transparent 40%),
      linear-gradient(180deg, #0a1128 0%, #03050f 100%);
    padding: 16px;
    position: relative;
    overflow-x: hidden;
    color: #caf0f8;
  }

  /* Звёзды */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: 
      radial-gradient(1.5px 1.5px at 15% 25%, #ffffff 50%, transparent 50%),
      radial-gradient(1px 1px at 35% 65%, #90e0ef 50%, transparent 50%),
      radial-gradient(1.2px 1.2px at 75% 15%, #ffffff 50%, transparent 50%),
      radial-gradient(1px 1px at 55% 85%, #00b4d8 50%, transparent 50%),
      radial-gradient(1.8px 1.8px at 90% 45%, #ffffff 50%, transparent 50%);
    opacity: 0.6;
    pointer-events: none;
    z-index: 0;
    animation: twinkle 5s infinite alternate;
  }
  @keyframes twinkle { 0% { opacity: 0.4; } 100% { opacity: 0.8; } }

  .container {
    max-width: 520px; width: 100%;
    background: rgba(10, 17, 40, 0.85);
    backdrop-filter: blur(10px);
    border: 2px solid #00b4d8;
    box-shadow: 
      0 0 30px rgba(0, 180, 216, 0.25),
      inset 0 0 40px rgba(0, 0, 0, 0.6);
    border-radius: 12px;
    padding: 30px 24px 36px;
    position: relative;
    z-index: 2;
  }

  /* Уголки-круги */
  .container::before, .container::after {
    content: '◎';
    position: absolute;
    color: #00b4d8;
    font-size: 20px;
    opacity: 0.5;
    animation: pulseCyan 3s infinite alternate;
  }
  .container::before { top: 8px; left: 12px; }
  .container::after { bottom: 8px; right: 12px; }
  
  @keyframes pulseCyan {
    0% { opacity: 0.3; text-shadow: 0 0 5px #00b4d8; }
    100% { opacity: 1; text-shadow: 0 0 15px #90e0ef; }
  }

  .screen {
    display: none; flex-direction: column; align-items: center; text-align: center;
    position: relative; z-index: 2; animation: materialize 0.5s ease;
  }
  .screen.active { display: flex; }
  
  @keyframes materialize { 
    0% { opacity: 0; filter: blur(4px); transform: scale(0.98); } 
    100% { opacity: 1; filter: blur(0); transform: scale(1); } 
  }

  h1 {
    font-size: 26px; font-weight: 700; color: #90e0ef;
    margin-bottom: 8px; letter-spacing: 1px;
    text-shadow: 0 0 15px rgba(144, 224, 239, 0.6);
  }
  h2 {
    font-size: 18px; font-weight: 600; color: #00b4d8;
    margin-bottom: 10px; letter-spacing: 1px;
    border-bottom: 1px solid #1a2a4a;
    padding-bottom: 8px;
    width: 100%;
  }
  p { font-size: 14px; color: #a9c1d9; line-height: 1.6; margin-bottom: 16px; }
  .sub { font-size: 12px; color: #6b8a9e; opacity: 0.9; font-style: italic; }

  .emblem { font-size: 54px; margin-bottom: 8px; filter: drop-shadow(0 0 15px rgba(0, 180, 216, 0.6)); }

  .btn {
    background: linear-gradient(180deg, #0077b6 0%, #023e8a 100%);
    border: 1px solid #00b4d8;
    color: #caf0f8;
    font-family: 'Trebuchet MS', sans-serif;
    font-size: 15px; font-weight: 700;
    padding: 14px 24px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.6);
    width: 100%; max-width: 320px; margin: 8px 0;
    letter-spacing: 1px;
  }
  .btn:hover {
    background: linear-gradient(180deg, #0096c7 0%, #0353a4 100%);
    color: #ffffff;
    border-color: #90e0ef;
    box-shadow: 0 0 20px rgba(0, 180, 216, 0.4);
  }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: 0.3; cursor: not-allowed; filter: grayscale(100%); }

  .btn-danger {
    background: linear-gradient(180deg, #7209b7 0%, #3a0ca3 100%);
    border: 1px solid #b5179e;
    color: #f72585;
  }
  .btn-danger:hover {
    background: linear-gradient(180deg, #9d4edd 0%, #480ca8 100%);
    border-color: #f72585;
    color: #fff;
    box-shadow: 0 0 20px rgba(247, 37, 133, 0.4);
  }

  .progress-wrap { width: 100%; margin-bottom: 20px; }
  .progress-bar-bg { height: 6px; background: #03050f; border: 1px solid #1a2a4a; border-radius: 3px; overflow: hidden; }
  .progress-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #0077b6, #00b4d8); box-shadow: 0 0 10px #00b4d8; transition: width 0.35s ease; }
  .progress-text { font-size: 10px; color: #6b8a9e; margin-top: 6px; text-align: right; letter-spacing: 1.5px; }

  .question-block { width: 100%; text-align: left; margin-bottom: 16px; }
  .question-block label { display: block; font-size: 13px; font-weight: 600; color: #90e0ef; margin-bottom: 6px; line-height: 1.45; }
  .question-block textarea {
    width: 100%; box-sizing: border-box;
    border: 1px solid #1a2a4a;
    border-radius: 6px;
    padding: 10px 12px;
    font-family: 'Trebuchet MS', sans-serif;
    font-size: 13px;
    background: #03050f;
    color: #caf0f8;
    resize: vertical; min-height: 44px;
    outline: none; transition: all 0.2s;
  }
  .question-block textarea::placeholder { color: #3a5a7a; }
  .question-block textarea:focus {
    border-color: #00b4d8;
    box-shadow: 0 0 12px rgba(0, 180, 216, 0.3);
    background: #0a1128;
  }

  .block-title { font-size: 15px; font-weight: 700; color: #00b4d8; margin: 4px 0 14px; text-align: center; width: 100%; letter-spacing: 1px; }

  /* Экран статистики */
  .stat-card {
    background: #03050f;
    border: 1px dashed #0077b6;
    border-radius: 8px;
    padding: 20px;
    width: 100%;
    margin: 15px 0;
    text-align: center;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
  }
  .stat-title { font-size: 13px; color: #6b8a9e; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; }
  .stat-percent { font-size: 48px; font-weight: bold; color: #00b4d8; text-shadow: 0 0 25px rgba(0, 180, 216, 0.8); margin-bottom: 10px; transition: color 0.5s; }
  .stat-verdict { font-size: 16px; color: #90e0ef; font-weight: bold; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; }
  .stat-desc { font-size: 13px; color: #a9c1d9; line-height: 1.6; text-align: left; }

  .status-ok { color: #90e0ef; font-size: 13px; margin-top: 10px; }
  .status-error { color: #f72585; font-size: 13px; margin-top: 10px; }

  @media (max-width: 480px) {
    .container { padding: 24px 14px 30px; }
    h1 { font-size: 20px; }
    .btn { font-size: 13px; padding: 12px 16px; }
    .stat-percent { font-size: 38px; }
  }
</style>
</head>
<body>

<div class="container" id="app">

  <!-- ЭКРАН 1: ПРИВЕТСТВИЕ -->
  <div class="screen active" id="screen0">
    <div class="emblem">🔵</div>
    <h1>Хроники Десятого Доктора</h1>
    <p>Привет, подруга. ТАРДИС зафиксировала временную аномалию.</p>
    <p class="sub">20 вопросов о характере, спутниках и приключениях Десятого Доктора. Проверим, насколько хорошо ты его знаешь.</p>
    <button class="btn" onclick="startSurvey()">Войти в ТАРДИС</button>
  </div>

  <!-- ЭКРАНЫ ВОПРОСОВ -->
  <div id="questionScreens"></div>

  <!-- ФИНАЛЬНЫЙ ЭКРАН -->
  <div class="screen" id="screenFinal">
    <div class="emblem" style="font-size: 40px;">🌀</div>
    <h2>Сканирование завершено</h2>
    
    <div class="stat-card">
      <div class="stat-title">Уровень совместимости</div>
      <div class="stat-percent" id="survivalPercent">--%</div>
      <div class="stat-verdict" id="survivalVerdict">Вычисляется...</div>
      <div class="stat-desc" id="survivalDesc">Ожидание данных...</div>
    </div>

    <button class="btn btn-danger" onclick="sendNotification()" id="sendBtn">📨 Передать Доктору</button>
    <p id="sendStatus"></p>
    
    <button class="btn" onclick="resetAll()" style="margin-top:8px;">Начать заново</button>
  </div>

</div>

<script>
  // ============================================================
  // 🔧 НАСТРОЙКИ
  // ============================================================
  const CONFIG = {
    BOT_TOKEN: "8813795823:AAG6oh1nW8wrOUEYe4VvO9hJD_IZUsSBsTI",
    CHAT_ID: "943862860",
  };
  // ============================================================

  // Блоки вопросов (20 вопросов, по 4 в каждом)
  const BLOCKS = [
    {
      name: "🌀 Личность и характер",
      questions: [
        "Какое прозвище чаще всего давали Десятому Доктору?",
        "Какую фразу он произносит, когда собирается бежать вперёд?",
        "Какой цвет глаз у Десятого Доктора?",
        "Что Доктор чаще всего носит с собой в карманах?"
      ]
    },
    {
      name: "💙 Спутники",
      questions: [
        "Кто была первой спутницей Десятого Доктора?",
        "Какая спутница стала причиной его «человеческой» версии?",
        "Кто из спутниц потерял память о Докторе в финале?",
        "Как звали невесту, которую Доктор встретил на Рождество?"
      ]
    },
    {
      name: "⚡ Ключевые моменты",
      questions: [
        "В каком эпизоде Доктор впервые встречает Плачущих Ангелов?",
        "Кто был главным врагом в финале четвёртого сезона?",
        "Какую планету Доктор сжёг, чтобы остановить далеков?",
        "Кто произнёс фразу «Я — Доктор, и я спасу вас всех»?"
      ]
    },
    {
      name: "💬 Цитаты и детали",
      questions: [
        "Какую фразу Доктор говорит перед тем, как стереть память Донне?",
        "Что Доктор сказал Уилфреду в кафе перед регенерацией?",
        "Какой музыкальный инструмент Доктор иногда упоминает?",
        "Какое слово Доктор говорит Розе при первой встрече?"
      ]
    },
    {
      name: "🎭 Актёр и эпоха",
      questions: [
        "Кто сыграл Десятого Доктора?",
        "В каком году состоялась регенерация Десятого Доктора в Одиннадцатого?",
        "Сколько лет было Доктору в момент его десятой регенерации?",
        "Какой цвет преобладал в интерьере ТАРДИС Десятого Доктора?"
      ]
    }
  ];

  let currentBlock = 0;
  let answers = [];
  let notificationSent = false;
  let survivalScore = 0;

  function initAnswers() {
    answers = BLOCKS.map(b => b.questions.map(() => ""));
  }
  initAnswers();

  function buildQuestionScreens() {
    const wrap = document.getElementById('questionScreens');
    wrap.innerHTML = '';
    BLOCKS.forEach((block, bi) => {
      const screen = document.createElement('div');
      screen.className = 'screen';
      screen.id = 'screenQ' + bi;
      screen.innerHTML = `
        <div class="progress-wrap">
          <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill${bi}"></div></div>
          <div class="progress-text">Сектор ${bi + 1} из ${BLOCKS.length}</div>
        </div>
        <div class="block-title">${block.name}</div>
        <div id="questionsWrap${bi}" style="width:100%;"></div>
        <button class="btn" id="nextBtn${bi}" onclick="nextBlock(${bi})" disabled>Далее →</button>
      `;
      wrap.appendChild(screen);

      const qWrap = screen.querySelector('#questionsWrap' + bi);
      block.questions.forEach((q, qi) => {
        const div = document.createElement('div');
        div.className = 'question-block';
        div.innerHTML = `
          <label>${bi * 4 + qi + 1}. ${q}</label>
          <textarea id="ans-${bi}-${qi}" placeholder="Введи ответ..." oninput="onAnswerInput(${bi}, ${qi})"></textarea>
        `;
        qWrap.appendChild(div);
      });
    });
  }
  buildQuestionScreens();

  function onAnswerInput(bi, qi) {
    const ta = document.getElementById(`ans-${bi}-${qi}`);
    answers[bi][qi] = ta.value.trim();
    updateNextButton(bi);
    updateProgress(bi);
  }

  function updateNextButton(bi) {
    const btn = document.getElementById('nextBtn' + bi);
    const filled = answers[bi].every(a => a.length > 0);
    btn.disabled = !filled;
    btn.textContent = filled ? 'Далее →' : 'Заполни все поля...';
  }

  function updateProgress(bi) {
    const fill = document.getElementById('progressFill' + bi);
    if (!fill) return;
    const filled = answers[bi].filter(a => a.length > 0).length;
    const total = answers[bi].length;
    fill.style.width = (filled / total * 100) + '%';
  }

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
    const target = document.getElementById(id);
    if (target) target.classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function startSurvey() {
    currentBlock = 0;
    showScreen('screenQ0');
    updateNextButton(0);
    updateProgress(0);
  }

  function nextBlock(bi) {
    if (bi < BLOCKS.length - 1) {
      currentBlock = bi + 1;
      showScreen('screenQ' + currentBlock);
      updateNextButton(currentBlock);
      updateProgress(currentBlock);
    } else {
      calculateSurvival();
      showFinal();
    }
  }

  // Логика подсчёта (ключевые слова из ответов)
  function calculateSurvival() {
    let score = 0;
    
    // Ключевые слова для начисления баллов (касающиеся Десятого Доктора)
    const positiveKeywords = [
      "доктор", "десятый", "теннант", "роза", "марта", "донна", 
      "тардис", "звуковая отвёртка", "отвёртка", "аллонзи", "allons-y", 
      "далек", "плачущие ангелы", "ангелы", "мастер", "галлифрей", 
      "повелитель времени", "регенерация", "уилфред", "джек", "сarah джейн",
      "беги", "run", "молот", "костюм", "кеды", "синий"
    ];
    
    // Негативные (если путает с другими Докторами)
    const negativeKeywords = [
      "одиннадцатый", "девятый", "двенадцатый", "тринадцатый", "смит", "капальди", "уитакер"
    ];

    answers.forEach(blockAnswers => {
      blockAnswers.forEach(ans => {
        const lowerAns = ans.toLowerCase();
        
        positiveKeywords.forEach(kw => {
          if (lowerAns.includes(kw)) score += 4;
        });

        negativeKeywords.forEach(kw => {
          if (lowerAns.includes(kw)) score -= 3;
        });

        if (ans.length > 15) score += 1;
      });
    });

    let basePercent = 25 + score; 
    survivalScore = Math.max(10, Math.min(98, basePercent + Math.floor(Math.random() * 8) - 4));

    const percentEl = document.getElementById('survivalPercent');
    const verdictEl = document.getElementById('survivalVerdict');
    const descEl = document.getElementById('survivalDesc');

    percentEl.textContent = survivalScore + '%';

    if (survivalScore >= 80) {
      percentEl.style.color = '#00f5d4';
      percentEl.style.textShadow = '0 0 30px rgba(0, 245, 212, 0.8)';
      verdictEl.textContent = 'Статус: ИДЕАЛЬНЫЙ СПУТНИК';
      descEl.textContent = 'Ты знаешь о Десятом Докторе практически всё. ТАРДИС открывает для тебя двери. Доктор был бы рад взять тебя в путешествие. Аллон-зи!';
    } else if (survivalScore >= 55) {
      percentEl.style.color = '#90e0ef';
      percentEl.style.textShadow = '0 0 20px rgba(144, 224, 239, 0.8)';
      verdictEl.textContent = 'Статус: ВЕРНЫЙ КОМПАНЬОН';
      descEl.textContent = 'Ты неплохо знаешь эпоху Десятого. Возможно, стоит пересмотреть пару серий, чтобы вспомнить детали. Но в целом — ты справишься.';
    } else if (survivalScore >= 35) {
      percentEl.style.color = '#ffd166';
      percentEl.style.textShadow = '0 0 20px rgba(255, 209, 102, 0.8)';
      verdictEl.textContent = 'Статус: ГОСТЬ ИЗ ПАРАЛЛЕЛЬНОЙ ВСЕЛЕННОЙ';
      descEl.textContent = 'Ты что-то слышала, но путаешься. Возможно, ты смотрела не все серии или просто забыла. Доктор бы поправил тебя, но с улыбкой.';
    } else if (survivalScore >= 20) {
      percentEl.style.color = '#f4a261';
      percentEl.style.textShadow = '0 0 20px rgba(244, 162, 97, 0.8)';
      verdictEl.textContent = 'Статус: СЛУЧАЙНЫЙ ПРОХОЖИЙ';
      descEl.textContent = 'Кажется, ты не очень хорошо знакома с Десятым Доктором. Срочно нужно посмотреть хотя бы пару серий с Дэвидом Теннантом.';
    } else {
      percentEl.style.color = '#f72585';
      percentEl.style.textShadow = '0 0 25px rgba(247, 37, 133, 0.9)';
      verdictEl.textContent = 'Статус: ДАЛЕК';
      descEl.textContent = 'Экстерминация! Ты знаешь о Докторе слишком мало. Или, что хуже, путаешь его с другими. ТАРДИС тебя не одобряет.';
    }
  }

  function showFinal() {
    notificationSent = false;
    const status = document.getElementById('sendStatus');
    status.textContent = '';
    status.className = '';
    const btn = document.getElementById('sendBtn');
    btn.style.display = 'block';
    btn.disabled = false;
    btn.textContent = '📨 Передать Доктору';
    showScreen('screenFinal');
  }

  async function sendNotification() {
    const btn = document.getElementById('sendBtn');
    const status = document.getElementById('sendStatus');

    if (notificationSent) {
      status.textContent = '✅ Данные уже переданы!';
      status.className = 'status-ok';
      return;
    }

    btn.disabled = true;
    btn.textContent = '⏳ Передача...';
    status.textContent = '⏳ Отправка...';
    status.className = '';

    let message = '🔵 ХРОНИКИ ДЕСЯТОГО ДОКТОРА 🔵\n';
    message += `Совместимость: ${survivalScore}%\n`;
    message += `Вердикт: ${document.getElementById('survivalVerdict').textContent.replace('Статус: ', '')}\n`;
    message += `----------------------------\n\n`;

    BLOCKS.forEach((block, bi) => {
      message += block.name + '\n';
      block.questions.forEach((q, qi) => {
        message += `${bi * 4 + qi + 1}. ${q}\n   ${answers[bi][qi] || '—'}\n`;
      });
      message += '\n';
    });

    try {
      const url = `https://api.telegram.org/bot${CONFIG.BOT_TOKEN}/sendMessage`;
      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          chat_id: CONFIG.CHAT_ID,
          text: message,
        })
      });
      const data = await response.json();
      if (data.ok) {
        status.textContent = '✅ Данные успешно переданы!';
        status.className = 'status-ok';
        notificationSent = true;
        btn.style.display = 'none';
      } else {
        throw new Error(data.description || 'Неизвестная ошибка');
      }
    } catch (error) {
      console.error('❌ Ошибка:', error);
      status.textContent = '❌ ' + error.message;
      status.className = 'status-error';
      btn.disabled = false;
      btn.textContent = '📨 Попробовать снова';
    }
  }

  function resetAll() {
    initAnswers();
    currentBlock = 0;
    notificationSent = false;

    document.querySelectorAll('.question-block textarea').forEach(ta => ta.value = '');
    document.querySelectorAll('.progress-bar-fill').forEach(f => f.style.width = '0%');
    BLOCKS.forEach((_, bi) => updateNextButton(bi));

    const status = document.getElementById('sendStatus');
    status.textContent = '';
    status.className = '';
    const btn = document.getElementById('sendBtn');
    btn.style.display = 'block';
    btn.disabled = false;
    btn.textContent = '📨 Передать Доктору';

    showScreen('screen0');
  }

</script>
</body>
</html>
